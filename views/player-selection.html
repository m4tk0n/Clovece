<div id="player-selection" class="menu-screen hidden">
        <div class="menu-bg">
            <div class="menu-content">
                <h2 class="glitch" data-text="VÝBĚR HRÁČŮ">VÝBĚR HRÁČŮ</h2>
                <div class="selection-container">
                    <div class="selection-group">
                        <label>Počet hráčů (2-8)</label>
                        <div class="slider-container">
                            <input type="range" id="total-players" min="2" max="8" value="4" class="slider">
                            <span id="total-players-value" class="slider-value">4</span>
                        </div>
                    </div>
                    <div class="selection-group">
                        <label>Počet lidí</label>
                        <div class="slider-container">
                            <input type="range" id="human-players" min="1" max="8" value="4" class="slider">
                            <span id="human-players-value" class="slider-value">4</span>
                        </div>
                    </div>
                    <div class="player-preview" id="player-preview">
                        <h3>Náhled hráčů:</h3>
                        <div class="preview-players" id="preview-players"></div>
                    </div>
                </div>
                <button id="start-game-btn" class="menu-btn">
                    <span>ZAČÍT HRU</span>
                    <i class="fas fa-dice"></i>
                </button>
                <button id="back-to-menu-btn" class="menu-btn secondary">
                    <span>ZPĚT</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </div>
    </div>
