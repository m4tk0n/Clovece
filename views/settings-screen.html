<div id="settings-screen" class="menu-screen hidden">
        <div class="menu-bg">
            <div class="menu-content">
                <h2 class="glitch" data-text="NASTAVENÍ">NASTAVENÍ</h2>
                <div class="settings-container">
                    <div class="setting-item">
                        <label>Hudba</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="music-toggle" checked>
                            <span class="slider-round"></span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Zvukové efekty</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="sfx-toggle" checked>
                            <span class="slider-round"></span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Animace</label>
                        <div class="toggle-switch">
                            <input type="checkbox" id="animations-toggle" checked>
                            <span class="slider-round"></span>
                        </div>
                    </div>
                    <div class="setting-item">
                        <label>Rychlost AI</label>
                        <select id="ai-speed">
                            <option value="fast">Rychlé</option>
                            <option value="medium" selected>Střední</option>
                            <option value="slow">Pomalé</option>
                        </select>
                    </div>
                </div>
                <button id="save-settings-btn" class="menu-btn">
                    <span>ULOŽIT</span>
                    <i class="fas fa-save"></i>
                </button>
                <button id="back-settings-btn" class="menu-btn secondary">
                    <span>ZPĚT</span>
                    <i class="fas fa-arrow-left"></i>
                </button>
            </div>
        </div>
    </div>
