<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Člověče, nezlob se! | Online Ludo Game</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Press+Start+2P&family=Rubik+Glitch&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-screen">
        <div class="loader">
            <div class="dice-loader">
                <div class="dice"></div>
                <div class="dice"></div>
                <div class="dice"></div>
            </div>
            <h2 class="glitch" data-text="ČLOVĚČE NEZLOB SE">ČLOVĚČE NEZLOB SE</h2>
            <p>Načítání hry...</p>
        </div>
    </div>

    <!-- Main Menu -->
    <div id="main-menu" class="menu-screen hidden">
        <div class="menu-bg">
            <div class="particles" id="particles"></div>
            <div class="menu-content">
                <div class="user-info" id="user-info" class="hidden">
                    <div class="user-avatar">
                        <i class="fas fa-user"></i>
                    </div>
                    <div class="user-details">
                        <span class="user-name" id="user-display-name">Hráč</span>
                        <div class="user-stats">
                            <span id="user-wins">0</span> výher | 
                            <span id="user-games">0</span> her
                        </div>
                    </div>
                    <button id="logout-btn" class="menu-btn secondary">
                        <span>ODHLÁSIT</span>
                        <i class="fas fa-sign-out-alt"></i>
                    </button>
                </div>
                
                <h1 class="game-title glitch" data-text="ČLOVĚČE NEZLOB SE">ČLOVĚČE NEZLOB SE</h1>
                <div class="game-logo">
                    <i class="fas fa-dice"></i>
                </div>
                
                <div class="menu-buttons">
                    <button id="play-btn" class="menu-btn pulse">
                        <span>HRÁT</span>
                        <i class="fas fa-play"></i>
                    </button>
                    <button id="create-room-btn" class="menu-btn">
                        <span>VYTVOŘIT MÍSTNOST</span>
                        <i class="fas fa-plus"></i>
                    </button>
                    <button id="join-room-btn" class="menu-btn">
                        <span>PŘIPOJIT SE</span>
                        <i class="fas fa-door-open"></i>
                    </button>
                    <button id="settings-btn" class="menu-btn">
                        <span>NASTAVENÍ</span>
                        <i class="fas fa-cog"></i>
                    </button>
                    <button id="rules-btn" class="menu-btn">
                        <span>PRAVIDLA</span>
                        <i class="fas fa-book"></i>
                    </button>
                </div>
                
                <div class="auth-buttons">
                    <button id="login-menu-btn" class="menu-btn secondary">
                        <span>PŘIHLÁSIT SE</span>
                        <i class="fas fa-sign-in-alt"></i>
                    </button>
                    <button id="register-menu-btn" class="menu-btn secondary">
                        <span>REGISTRACE</span>
                        <i class="fas fa-user-plus"></i>
                    </button>
                </div>
                
                <div class="credits">
                    <p>Vytvořeno s <i class="fas fa-heart"></i> pro zábavu</p>
                </div>
            </div>
        </div>
    </div>

        <!-- Secondary screens are fetched on demand into this host. -->
    <div id="screen-host"></div>

<!-- Audio Elements -->
    <audio id="dice-sound" preload="none" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3"></audio>
    <audio id="kick-sound" preload="none" src="https://assets.mixkit.co/active_storage/sfx/2955/2955-preview.mp3"></audio>
    <audio id="win-sound" preload="none" src="https://assets.mixkit.co/active_storage/sfx/284/284-preview.mp3"></audio>
    <audio id="move-sound" preload="none" src="https://assets.mixkit.co/active_storage/sfx/270/270-preview.mp3"></audio>
    <audio id="background-music" preload="none" src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" loop></audio>

    <!-- JavaScript modules: only the small bootstrap is loaded initially. -->
    <script type="module" src="js/bootstrap.js"></script>
</body>
</html>
