name: AI self-play sběr dat

on:
  workflow_dispatch:
    inputs:
      games:
        description: Počet partií
        required: false
        default: "250"
        type: string
      players:
        description: Počet AI hráčů
        required: false
        default: "4"
        type: choice
        options: ["2", "3", "4", "5", "6", "7", "8"]
      board:
        description: Velikost desky
        required: false
        default: "40"
        type: choice
        options: ["40", "48", "80"]
      seed:
        description: Seed pro opakovatelnost
        required: false
        default: ""
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/ai-self-play.mjs'
      - 'js/ai-strategy.js'
      - 'js/ai-weight-config.js'
      - 'js/ai-original-baseline.js'
      - 'config/ai-tactical-weights.json'
      - 'config/ai-original-baseline.json'
      - 'js/ai-neural-network.js'
      - 'tests/ai-neural-network.test.mjs'
      - 'tests/ai-strategy.test.mjs'
      - 'tests/ai-self-play.test.mjs'
      - '.github/workflows/ai-self-play.yml'
  schedule:
    - cron: "17 3 * * 1"
    - cron: "17 3 * * 3"
    - cron: "17 3 * * 5"

concurrency:
  group: ai-self-play-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  self-play:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Nastavit variantu sběru a ověřit kombinaci
        id: config
        run: |
          PLAYERS="${{ inputs.players || '4' }}"
          BOARD="${{ inputs.board || '40' }}"
          SEED="${{ inputs.seed }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            case "${{ github.event.schedule }}" in
              "17 3 * * 1") PLAYERS=4; BOARD=40 ;;
              "17 3 * * 3") PLAYERS=6; BOARD=48 ;;
              "17 3 * * 5") PLAYERS=8; BOARD=80 ;;
            esac
          fi
          if [ -z "$SEED" ]; then SEED="${{ github.run_id }}"; fi
          if [ "$BOARD" = "40" ] && [ "$PLAYERS" -gt 4 ]; then exit 1; fi
          if [ "$BOARD" = "48" ] && [ "$PLAYERS" -gt 6 ]; then exit 1; fi
          if [ "$BOARD" = "80" ] && [ "$PLAYERS" -gt 8 ]; then exit 1; fi
          echo "players=$PLAYERS" >> "$GITHUB_OUTPUT"
          echo "board=$BOARD" >> "$GITHUB_OUTPUT"
          echo "seed=$SEED" >> "$GITHUB_OUTPUT"
      - name: Cílené testy enginu a rozhodování AI
        run: node --test tests/game-engine.test.mjs tests/local-game-rules.test.mjs tests/ai-strategy.test.mjs tests/ai-self-play.test.mjs tests/ai-tactical-weights.test.mjs tests/ai-original-baseline.test.mjs
      - name: Self-play partie
        run: |
          mkdir -p artifacts
          if [ "${{ github.event_name }}" = "push" ]; then
            index=0
            for config in "4 40" "6 48" "8 80"; do
              set -- $config
              PLAYERS="$1"
              BOARD="$2"
              SEED=$((${{ steps.config.outputs.seed }} + index * 100000))
              node scripts/ai-self-play.mjs \
                --games=250 \
                --players="$PLAYERS" \
                --board="$BOARD" \
                --seed="$SEED" \
                --output="artifacts/ai-self-play-$BOARD-$PLAYERS.jsonl" \
                --metrics="artifacts/ai-self-play-metrics-$BOARD-$PLAYERS.json"
              index=$((index + 1))
            done
          else
            PLAYERS="${{ steps.config.outputs.players }}"
            BOARD="${{ steps.config.outputs.board }}"
            node scripts/ai-self-play.mjs \
              --games="${{ inputs.games || '250' }}" \
              --players="$PLAYERS" \
              --board="$BOARD" \
              --seed="${{ steps.config.outputs.seed }}" \
              --output="artifacts/ai-self-play-$BOARD-$PLAYERS.jsonl" \
              --metrics="artifacts/ai-self-play-metrics-$BOARD-$PLAYERS.json"
          fi
      - name: Uložit trénovací data a výsledky
        uses: actions/upload-artifact@v4
        with:
          name: ai-self-play-${{ github.run_number }}
          path: artifacts/
          retention-days: 90

      - name: Trvale archivovat data na branch ai-training-data
        env:
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          mkdir -p training-data/self-play
          for DATA_FILE in artifacts/ai-self-play-*.jsonl; do
            [ -f "$DATA_FILE" ] || continue
            SUFFIX="${DATA_FILE#artifacts/ai-self-play-}"
            SUFFIX="${SUFFIX%.jsonl}"
            gzip -c "$DATA_FILE" > "training-data/self-play/run-${RUN_ID}-${SUFFIX}.jsonl.gz"
            cp "artifacts/ai-self-play-metrics-${SUFFIX}.json" "training-data/self-play/run-${RUN_ID}-${SUFFIX}-metrics.json"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin ai-training-data:refs/remotes/origin/ai-training-data
          git switch -C ai-training-data --track origin/ai-training-data
          git add training-data/self-play/
          git commit -m "Archive AI self-play run ${RUN_NUMBER}"
          git push origin ai-training-data
