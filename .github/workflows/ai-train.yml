name: AI neuronové trénování (kandidát)

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ai-train.mjs'
      - 'tests/ai-train.test.mjs'
      - '.github/workflows/ai-train.yml'
      - 'js/ai-neural-network.js'
  workflow_dispatch:
    inputs:
      epochs:
        description: Počet trénovacích epoch
        required: true
        default: "40"
        type: string
      seed:
        description: Seed inicializace a míchání
        required: true
        default: "20261108"
        type: string

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Načíst archiv self-play dat
        run: |
          git fetch origin ai-training-data
          mkdir -p training-data/self-play
          git archive FETCH_HEAD training-data/self-play | tar -x
          test -n "$(find training-data/self-play -name '*.jsonl.gz' -print -quit)"
      - name: Syntaxe trénovacího skriptu
        run: node --check scripts/ai-train.mjs
      - name: Test exportu modelu kompatibilního s runtime
        run: node --test tests/ai-train.test.mjs
      - name: Ověřit vstupní formát a neuronovou vrstvu
        run: node --test tests/ai-neural-network.test.mjs tests/ai-strategy.test.mjs
      - name: Zjistit, zda archiv obsahuje dostatek dat schema v2
        id: dataset
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import zlib from 'node:zlib';
          import { AI_FEATURE_COUNT } from './js/ai-neural-network.js';
          const dir = 'training-data/self-play';
          let pairs = 0;
          for (const name of fs.readdirSync(dir).filter(file => /\\.jsonl\\.gz$/i.test(file))) {
            const text = zlib.gunzipSync(fs.readFileSync(path.join(dir, name))).toString('utf8');
            for (const line of text.split(/\\r?\\n/).filter(Boolean)) {
              const record = JSON.parse(line);
              if (record.completed !== true || !Array.isArray(record.candidates)) continue;
              const candidates = record.candidates.filter(item =>
                Array.isArray(item.features) && item.features.length === AI_FEATURE_COUNT &&
                item.features.every(Number.isFinite) && Number.isFinite(item.teacherScore));
              if (candidates.length >= 2) pairs += candidates.length * (candidates.length - 1) / 2;
            }
          }
          const ready = pairs >= 100;
          console.log('Kompatibilní párové příklady schema v' + AI_FEATURE_COUNT + ': ' + pairs);
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'ready=' + ready + '\\n');
          NODE
      - name: Natrénovat kandidátní model
        if: steps.dataset.outputs.ready == 'true'
        run: |
          node scripts/ai-train.mjs \
            --input-dir=training-data/self-play \
            --epochs="${{ inputs.epochs }}" \
            --seed="${{ inputs.seed }}" \
            --output=artifacts/ludo-ai-candidate.js \
            --metrics=artifacts/ai-training-metrics.json
      - name: Uložit kandidáta a výsledky (bez nasazení)
        if: steps.dataset.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ai-neural-candidate-${{ github.run_number }}
          path: artifacts/
          retention-days: 90
      - name: Vysvětlit přeskočení tréninku
        if: steps.dataset.outputs.ready != 'true'
        run: echo "Trénink přeskočen – archiv zatím neobsahuje 100 kompatibilních párů schema v2. Nejdříve je potřeba dokončit nový self-play sběr."
