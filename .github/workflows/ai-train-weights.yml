name: AI reward training and tactical tournament

on:
  workflow_run:
    workflows: ["AI self-play sběr dat"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ai-reward-training-and-tournament
  cancel-in-progress: false

jobs:
  train-and-compete:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Nastavit Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Načíst archivované self-play partie
        run: |
          git fetch origin ai-training-data:refs/remotes/origin/ai-training-data
          mkdir -p training-data/self-play
          git archive origin/ai-training-data training-data/self-play | tar -x
          COUNT=$(find training-data/self-play -type f -name '*.jsonl*' | wc -l)
          echo "Archivované datové soubory: $COUNT"
          test "$COUNT" -gt 0
      - name: Vypočítat kandidátní váhy ze skutečných výsledků partií
        id: train-weights
        run: |
          mkdir -p artifacts
          node scripts/ai-train-weights.mjs \
            --input-dir=training-data/self-play \
            --current-weights=config/ai-tactical-weights.json \
            --output-weights=artifacts/ai-tactical-weights-candidate.json \
            --module=artifacts/ai-tactical-weights-candidate.js \
            --report=artifacts/ai-weight-training-report.json
      - name: Turnaj kandidáta proti aktivní AI na deskách 40, 48 a 80
        id: tournament
        run: |
          if [ ! -f artifacts/ai-tactical-weights-candidate.json ]; then
            echo "Trénink nevytvořil lepšího kandidáta. Aktivní váhy zůstávají beze změny."
            exit 0
          fi
          STATUS=0
          node scripts/ai-weight-tournament.mjs \
            --candidate=artifacts/ai-tactical-weights-candidate.json \
            --baseline=config/ai-tactical-weights.json \
            --output=artifacts/ai-weight-tournament-report.json \
            --games-per-board=120 || STATUS=$?
          if [ "$STATUS" -ne 0 ] && [ "$STATUS" -ne 2 ]; then
            exit "$STATUS"
          fi
      - name: Automaticky nasadit vítězné váhy do main
        id: promote
        if: steps.tournament.outcome == 'success'
        run: |
          if [ ! -f artifacts/ai-weight-tournament-report.json ]; then
            echo "Turnaj nebyl spuštěn; aktivní váhy zůstávají beze změny."
            exit 0
          fi
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const report = JSON.parse(fs.readFileSync('artifacts/ai-weight-tournament-report.json', 'utf8'));
          if (report.accepted !== true) {
            console.log('Kandidát turnajem neprošel. Aktivní váhy se nemění.');
            process.exit(0);
          }
          const candidate = JSON.parse(fs.readFileSync('artifacts/ai-tactical-weights-candidate.json', 'utf8'));
          const active = JSON.parse(fs.readFileSync('config/ai-tactical-weights.json', 'utf8'));
          const keys = Object.keys(active.weights);
          if (keys.some(key => Number(candidate.basedOnWeights?.[key]) !== Number(active.weights[key]))) {
            throw new Error('Aktivní váhy se od vytvoření kandidáta změnily. Automatické nasazení zrušeno.');
          }
          const next = {
            version: 1,
            trainedAt: candidate.candidateCreatedAt,
            trainingMethod: candidate.trainingMethod,
            sourceGames: candidate.sourceGames,
            tournament: {
              completedGames: report.gamesCompleted,
              candidateWins: report.overall.candidateWins,
              baselineWins: report.overall.baselineWins,
              candidateWinRate: report.overall.candidateWinRate,
              confidence95: report.overall.candidateWinRate95CI,
              reportCreatedAt: report.createdAt
            },
            weights: candidate.weights
          };
          fs.writeFileSync('config/ai-tactical-weights.json', JSON.stringify(next, null, 2) + '\n');
          fs.writeFileSync('js/ai-tactical-weights.js',
            '// Generated from config/ai-tactical-weights.json after a successful head-to-head tournament.\n' +
            'export const AI_TACTICAL_WEIGHTS = Object.freeze(' + JSON.stringify(next.weights, null, 2) + ');\n');
          console.log('Nové váhy prošly turnajem; připraveno k nasazení.');
          NODE
          if ! git diff --quiet -- config/ai-tactical-weights.json js/ai-tactical-weights.js; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/ai-tactical-weights.json js/ai-tactical-weights.js
            git commit -m "Promote tactical AI weights after tournament"
            git push origin HEAD:main
            echo "promoted=true" >> "$GITHUB_OUTPUT"
          else
            echo "Nebyly vytvořeny žádné změny aktivních vah."
          fi
      - name: Zveřejnit stav učení pro debug
        id: state
        if: always() && steps.tournament.outcome == 'success' && steps.train-weights.outcome == 'success'
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const training = JSON.parse(fs.readFileSync('artifacts/ai-weight-training-report.json', 'utf8'));
          const tournament = fs.existsSync('artifacts/ai-weight-tournament-report.json')
            ? JSON.parse(fs.readFileSync('artifacts/ai-weight-tournament-report.json', 'utf8')) : null;
          const previous = training.previousWeights;
          const candidate = training.candidateWeights;
          const finalWeights = tournament?.accepted === true ? candidate : previous;
          const keys = Object.keys(previous);
          const delta = Object.fromEntries(keys.map(key => [key,
            Number((Number(candidate[key]) - Number(previous[key])).toFixed(8))]));
          const state = {
            format: 'clovece-ai-training-state',
            version: 1,
            updatedAt: new Date().toISOString(),
            status: tournament?.accepted === true ? 'promoted' :
              tournament ? 'tournament-rejected' :
              training.accepted ? 'awaiting-tournament' : 'validation-rejected',
            statusLabel: tournament?.accepted === true ? 'NOVÉ VÁHY NASAZENY' :
              tournament ? 'KANDIDÁT ZAMÍTNUT' :
              training.accepted ? 'ČEKÁ NA TURNAJ' : 'VALIDACE ZAMÍTLA KANDIDÁTA',
            previousWeights: previous,
            candidateWeights: candidate,
            finalWeights,
            delta,
            training: {
              accepted: training.accepted,
              source: training.source,
              decisions: training.decisions,
              validation: training.validation,
              method: training.method
            },
            tournament: tournament ? {
              accepted: tournament.accepted,
              gamesCompleted: tournament.gamesCompleted,
              candidateWins: tournament.overall?.candidateWins,
              baselineWins: tournament.overall?.baselineWins,
              candidateWinRate: tournament.overall?.candidateWinRate,
              candidateWinRate95CI: tournament.overall?.candidateWinRate95CI,
              boards: tournament.boards,
              decision: tournament.decision
            } : null
          };
          fs.writeFileSync('config/ai-training-state.json', JSON.stringify(state, null, 2) + '\n');
          NODE
          if ! git diff --quiet -- config/ai-training-state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add config/ai-training-state.json
            git commit -m "Publish AI training diagnostics"
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Nasadit společné váhy a stav učení na Webzdarma
        if: steps.state.outputs.changed == 'true' || steps.promote.outputs.promoted == 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: /clovece/
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            .env
            README.md
            docs/**
            scripts/**
            tests/
            package.json
            package-lock.json
            playwright.config.js
            playwright-report/**
            test-results/**
            node_modules/****
            tests/
      - name: Uložit report tréninku a turnaje
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-weight-cycle-${{ github.run_number }}
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90
