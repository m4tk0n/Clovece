name: Test game engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --experimental-default-type=module --check js/bootstrap.js
          node --experimental-default-type=module --check js/app.js
          node --experimental-default-type=module --check js/dice.js
          node --experimental-default-type=module --check js/dice-rotation.js
          node --experimental-default-type=module --check js/settings.js
          node --experimental-default-type=module --check js/player-setup.js
          node --experimental-default-type=module --check js/game-log.js
          node --experimental-default-type=module --check js/game-view.js
          node --experimental-default-type=module --check js/game-turn.js
          node --experimental-default-type=module --check js/online.js
          node --experimental-default-type=module --check js/game-engine.js
          node --experimental-default-type=module --check js/game-board-geometry.js
          node --experimental-default-type=module --check js/game-board-scene.js
          node --experimental-default-type=module --check js/game-board-2d.js
          node --experimental-default-type=module --check js/game-board-view.js
          node --experimental-default-type=module --check js/game-board.js
          node --experimental-default-type=module --check js/game-board-3d.js
      - name: Test game rules
        run: node --experimental-default-type=module --test tests/*.test.mjs

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: Check PHP syntax
        run: |
          php -l config.php
          php -l screen.php
          for file in screens/*.php; do php -l "$file"; done
          php -l install/install.php
          php -l online-api.php
          php -l lib/game-engine.php
          php -l tests/online-engine.test.php
          php tests/online-engine.test.php
