name: Test game engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test game rules
        run: node --experimental-default-type=module --test tests/game-engine.test.mjs
