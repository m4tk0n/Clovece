# .github/workflows/test-game.yml
name: Test game engine

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: find js -type f -name '*.js' -print0 | xargs -0 -n1 node --experimental-default-type=module --check
      - name: Test game rules
        run: node --experimental-default-type=module --test tests/*.test.mjs

  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
      - name: Check PHP syntax
        run: |
          php -l index.php
          php -l config.php
          php -l screen.php
          for file in screens/*.php; do php -l "$file"; done
          php -l install/install.php
          php -l online-api.php
          php -l lib/game-engine.php
          php -l lib/account-auth.php
          php -l tests/online-engine.test.php
          php tests/online-engine.test.php
