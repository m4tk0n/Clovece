name: Remote hosting smoke test

on:
  workflow_run:
    workflows: ["Deploy na FTP"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  remote-account-test:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Check remote PHP and database schema
        env:
          BASE_URL: https://7x.wz.cz/clovece
          REMOTE_TEST_TOKEN: ${{ secrets.REMOTE_TEST_TOKEN }}
        run: |
          if [ -z "$REMOTE_TEST_TOKEN" ]; then
            echo "::error::Chybí GitHub Actions secret REMOTE_TEST_TOKEN."
            exit 1
          fi
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/remote-test.php" \
            -H "Authorization: Bearer $REMOTE_TEST_TOKEN" \
            --data "action=status" | tee remote-status.json
          python -c "import json; d=json.load(open('remote-status.json')); assert d.get('success'), d"

      - name: Read complete production database schema and storage usage
        env:
          BASE_URL: https://7x.wz.cz/clovece
          REMOTE_TEST_TOKEN: ${{ secrets.REMOTE_TEST_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "$BASE_URL/remote-test.php" \
            -H "Authorization: Bearer $REMOTE_TEST_TOKEN" \
            --data "action=database_report" | tee database-report.json
          python - <<'PY'
          import json
          d = json.load(open("database-report.json"))
          assert d.get("success") is True, d
          assert d.get("table_count") == len(d.get("tables", [])), "Neúplný seznam tabulek"
          print("PHP:", d.get("php_version"))
          print("DATABASE:", d.get("database"))
          print("MYSQL:", d.get("server", {}).get("version"), d.get("server", {}).get("version_comment"))
          print("CHARSET/COLLATION:", d.get("server", {}).get("character_set_server"), d.get("server", {}).get("collation_server"))
          print("DATABASE SIZE:", json.dumps(d.get("database_size", {}), ensure_ascii=False))
          print("TABLE COUNT:", d["table_count"])
          for t in d.get("tables", []):
              print(f"\\n{t['name']}: exact_rows={t['exact_rows']}, estimated_rows={t['estimated_rows']}, data={t['data_bytes']} B, indexes={t['index_bytes']} B, free={t['free_bytes']} B")
              print("  columns:", ", ".join(c["COLUMN_NAME"] + " " + c["COLUMN_TYPE"] for c in t["columns"]))
              print("  indexes:", json.dumps(t["indexes"], ensure_ascii=False))
              for c in t.get("measured_columns", []):
                  print(f"  data {c['column']}: total={c['total_value_octets']} B, avg={c['average_value_octets']} B, max={c['max_value_octets']} B, null={c['null_rows']}")
          print("\\nFOREIGN KEYS:", json.dumps(d.get("foreign_keys", []), ensure_ascii=False))
          print("FOREIGN KEY ORPHANS:", json.dumps(d.get("foreign_key_orphan_checks", []), ensure_ascii=False))
          print("LOGICAL RELATION ORPHANS:", json.dumps(d.get("logical_integrity_checks", []), ensure_ascii=False))
          print("TRIGGERS:", json.dumps(d.get("triggers", []), ensure_ascii=False))
          print("VIEWS:", json.dumps(d.get("views", []), ensure_ascii=False))
          print("ROUTINES:", json.dumps(d.get("routines", []), ensure_ascii=False))
          print("EVENTS:", json.dumps(d.get("events", []), ensure_ascii=False))
          print("LIMITATIONS:", json.dumps(d.get("limitations", {}), ensure_ascii=False))
          PY

      - name: Test real registration, logout and login through online API
        env:
          BASE_URL: https://7x.wz.cz/clovece
          REMOTE_TEST_TOKEN: ${{ secrets.REMOTE_TEST_TOKEN }}
        run: |
          python - <<'PY'
          import os, re, secrets, string, sys
          import requests

          base = os.environ["BASE_URL"].rstrip("/")
          token = os.environ["REMOTE_TEST_TOKEN"]
          api = base + "/online-api.php"
          helper = base + "/remote-test.php"
          session = requests.Session()
          username = "ghatest_" + secrets.token_hex(6)
          password = secrets.token_urlsafe(24)
          cleanup_ok = False

          def require(condition, message):
              if not condition:
                  raise RuntimeError(message)

          def api_post(action, csrf, **fields):
              response = session.post(api, data={"action": action, "csrf_token": csrf, **fields}, timeout=25)
              try:
                  data = response.json()
              except ValueError:
                  raise RuntimeError(f"{action}: API nevrátila JSON (HTTP {response.status_code})")
              require(response.status_code == 200 and data.get("success") is True,
                      f"{action}: HTTP {response.status_code}: {data}")
              return data

          try:
              bootstrap_response = session.get(api, params={"action": "bootstrap"}, timeout=25)
              require(bootstrap_response.status_code == 200, f"bootstrap HTTP {bootstrap_response.status_code}")
              bootstrap = bootstrap_response.json()
              require(bootstrap.get("success") is True and bootstrap.get("csrf_token"),
                      f"bootstrap failed: {bootstrap}")
              csrf = bootstrap["csrf_token"]

              registered = api_post(
                  "register", csrf,
                  username=username,
                  password=password,
                  display_name="GitHub test",
                  color="#ff6b6b",
              )
              require(registered.get("player", {}).get("username") == username,
                      "Registrace nevrátila vytvořený účet.")
              csrf = registered.get("csrf_token")
              require(bool(csrf), "Registrace nevrátila CSRF token.")
              print("PASS: registrace nového testovacího účtu")

              logged_out = api_post("logout", csrf)
              csrf = logged_out.get("csrf_token")
              require(bool(csrf), "Odhlášení nevrátilo CSRF token.")
              print("PASS: odhlášení po registraci")

              logged_in = api_post("login", csrf, username=username, password=password)
              require(logged_in.get("player", {}).get("username") == username,
                      "Přihlášení nevrátilo očekávaný účet.")
              csrf = logged_in.get("csrf_token")
              require(bool(csrf), "Přihlášení nevrátilo CSRF token.")
              print("PASS: přihlášení vytvořeným účtem")

              verified = session.get(api, params={"action": "bootstrap"}, timeout=25).json()
              require(verified.get("account", {}).get("username") == username,
                      f"Bootstrap nepotvrdil přihlášený účet: {verified}")
              print("PASS: bootstrap potvrzuje aktivní přihlášení")

              api_post("logout", csrf)
              print("PASS: závěrečné odhlášení")
          finally:
              cleanup = session.post(
                  helper,
                  headers={"Authorization": "Bearer " + token},
                  data={"action": "cleanup", "username": username},
                  timeout=25,
              )
              try:
                  cleanup_data = cleanup.json()
              except ValueError:
                  cleanup_data = {"body": cleanup.text[:500]}
              cleanup_ok = cleanup.status_code == 200 and cleanup_data.get("success") is True
              print("CLEANUP:", cleanup_data)
              if not cleanup_ok:
                  print("::error::Testovací účet se nepodařilo automaticky odstranit.", file=sys.stderr)

          require(cleanup_ok, "Úklid testovacího účtu selhal.")
          print("PASS: testovací účet a identita byly odstraněny")
          PY

      - name: Save database report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-database-report
          path: database-report.json
          if-no-files-found: ignore
          retention-days: 3
