name: Read-only FTP audit

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/ftp-audit.yml"
      - "scripts/ftp-audit.mjs"

permissions:
  contents: read

concurrency:
  group: ftp-read-only-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout GitHub main
        uses: actions/checkout@v5

      - name: Install the same FTP client library as deployment
        run: npm install --no-save --no-package-lock basic-ftp@5.2.1

      - name: Check FTP audit script
        run: node scripts/ftp-audit.mjs --self-test

      - name: Compare FTP inventory with GitHub main
        if: github.event_name == 'workflow_dispatch'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_AUDIT_REMOTE_ROOT: /clovece/
          FTP_AUDIT_OUTPUT_DIR: audit-output
        run: node scripts/ftp-audit.mjs

      - name: Publish sanitized audit report
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: clovece-ftp-audit
          path: audit-output/
          if-no-files-found: error
          retention-days: 14
