name: AI self-play training (debug)

# Trénink běží po částech (výchozí rozpočet 85 min), po každé části uloží checkpoint
# a sám spustí další část, dokud nejsou hotové všechny generace (nebo dojde chain_left).

on:
  workflow_dispatch:
    inputs:
      method:
        description: "cem = přímá optimalizace míry výher, reinforce = policy gradient"
        required: true
        type: choice
        options: [cem, reinforce]
        default: cem
      generations:
        description: CELKOVÝ počet generací (cem) nebo aktualizací (reinforce)
        required: true
        type: number
        default: 20
      games:
        description: Partií na kandidáta (cem) nebo na dávku (reinforce)
        required: true
        type: number
        default: 200
      final_games:
        description: Partií pro ověření průměru / šampiona
        required: true
        type: number
        default: 500
      max_minutes:
        description: Časový rozpočet jedné části v minutách (pod limit běhu)
        required: true
        type: number
        default: 85
      chain_left:
        description: Kolikrát se smí workflow automaticky spustit znovu (pojistka)
        required: true
        type: number
        default: 12
      resume:
        description: Pokračovat z checkpointu předchozího běhu
        required: false
        type: boolean
        default: false
      resume_run_id:
        description: ID předchozího běhu tohoto workflow (jen při resume)
        required: false
        type: string
        default: ''

concurrency:
  group: ai-selfplay-training
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Restore previous checkpoint
        if: inputs.resume && inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: ai-selfplay-results
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}

      - name: Automated tests (first part only)
        if: ${{ !inputs.resume }}
        run: node --experimental-default-type=module --test tests/debug-ai-selfplay.test.mjs

      - name: Train (time-limited part)
        timeout-minutes: 98
        run: |
          RESUME=""
          if [ "${{ inputs.resume }}" = "true" ]; then RESUME="--resume"; fi
          if [ "${{ inputs.method }}" = "cem" ]; then
            node --experimental-default-type=module debug/scripts/train-cem.mjs \
              --generations=${{ inputs.generations }} --games=${{ inputs.games }} \
              --final-games=${{ inputs.final_games }} --setups=2 \
              --max-minutes=${{ inputs.max_minutes }} \
              --checkpoint=artifacts/selfplay-checkpoint.json --report=artifacts/selfplay-report.json $RESUME
          else
            node --experimental-default-type=module debug/scripts/train-selfplay.mjs \
              --updates=${{ inputs.generations }} --batch=${{ inputs.games }} \
              --gate-games=${{ inputs.final_games }} --anchor-games=${{ inputs.final_games }} --setups=2 \
              --max-minutes=${{ inputs.max_minutes }} \
              --checkpoint=artifacts/selfplay-checkpoint.json --report=artifacts/selfplay-report.json $RESUME
          fi

      - name: Check progress
        id: progress
        if: always()
        run: |
          DONE=false
          if [ -f artifacts/selfplay-checkpoint.json ]; then
            STEP=$(node -e "console.log(JSON.parse(require('fs').readFileSync('artifacts/selfplay-checkpoint.json','utf8')).step)")
            echo "Hotovo $STEP z ${{ inputs.generations }}"
            if [ "$STEP" -ge "${{ inputs.generations }}" ]; then DONE=true; fi
          fi
          echo "done=$DONE" >> "$GITHUB_OUTPUT"

      - name: Independent validation vs original weights (only when finished; writes nothing)
        if: always() && steps.progress.outputs.done == 'true'
        run: |
          node --experimental-default-type=module debug/scripts/promote-weights.mjs \
            --checkpoint=artifacts/selfplay-checkpoint.json --games=600 --big-games=12 | tee artifacts/validation.txt

      - name: Ablation - real contribution of the new weights 11-18 (only when finished)
        if: always() && steps.progress.outputs.done == 'true'
        timeout-minutes: 15
        run: |
          node --experimental-default-type=module debug/scripts/ablate-signals.mjs \
            --checkpoint=artifacts/selfplay-checkpoint.json --games=150 --out=artifacts/ablation.json | tee artifacts/ablation.txt

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-selfplay-results
          path: artifacts/
          if-no-files-found: warn
          retention-days: 90

      - name: Start next part automatically
        if: steps.progress.outputs.done == 'false' && inputs.chain_left > 0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run ai-selfplay-training.yml --ref "${{ github.ref_name }}" \
            -f method="${{ inputs.method }}" \
            -f generations="${{ inputs.generations }}" \
            -f games="${{ inputs.games }}" \
            -f final_games="${{ inputs.final_games }}" \
            -f max_minutes="${{ inputs.max_minutes }}" \
            -f chain_left="$(( ${{ inputs.chain_left }} - 1 ))" \
            -f resume=true \
            -f resume_run_id="${{ github.run_id }}"
