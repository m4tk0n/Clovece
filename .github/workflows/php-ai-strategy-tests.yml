name: PHP AI strategy tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  php-ai-strategy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
      - name: Lint PHP sources
        run: find . -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l
      - name: Test fixed online AI strategy
        run: php tests/ai-strategy.php
