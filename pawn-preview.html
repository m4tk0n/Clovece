<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D figurka – zkouška otáčení</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#101714;color:#f2f5f2}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#293a32 0,#17231d 42%,#0d1411 100%);display:flex;flex-direction:column}
header{padding:22px 18px 10px;text-align:center}
h1{font-size:clamp(21px,4vw,30px);margin:0 0 7px;font-weight:700;letter-spacing:.02em}
p{margin:0;color:#b9c8bf;font-size:14px}
main{width:min(100%,900px);margin:auto;display:flex;flex-direction:column;align-items:center;padding:8px 14px 28px;gap:14px}
#stage{position:relative;width:min(100%,760px);height:min(68vh,620px);min-height:360px;border:1px solid #52645a;border-radius:18px;overflow:hidden;background:radial-gradient(ellipse at 50% 43%,#34483d 0,#1c2b23 50%,#111a15 100%);box-shadow:0 24px 70px #0008;touch-action:none}
#stage canvas{display:block;width:100%;height:100%;touch-action:none}
.hint{position:absolute;left:12px;right:12px;bottom:12px;text-align:center;pointer-events:none;color:#d4e0d8;background:#101914b8;border:1px solid #60746877;border-radius:999px;padding:8px 12px;font-size:12px;backdrop-filter:blur(8px)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
button{border:1px solid #71877a;background:#24382d;color:#f3f7f4;border-radius:10px;padding:11px 18px;font:inherit;font-size:14px;cursor:pointer}
button:hover{background:#304b3b}
button:focus-visible{outline:2px solid #d7f2df;outline-offset:3px}
.status{min-height:18px;color:#9fb1a5;font-size:12px;text-align:center}
@media(max-width:520px){#stage{height:62vh;min-height:340px;border-radius:12px}.hint{font-size:11px}}
</style>
</head>
<body>
<header>
<h1>3D figurka na podstavci</h1>
<p>Samostatný test modelu a ovládání před zapojením do herní desky.</p>
</header>
<main>
<div id="stage" aria-label="Interaktivní 3D figurka">
<div class="hint">Otáčej tažením prstu nebo myši · Přibližuj dvěma prsty nebo kolečkem</div>
</div>
<div class="controls">
<button id="reset-view" type="button">Vrátit pohled</button>
<button id="toggle-spin" type="button" aria-pressed="false">Automatické otáčení: vypnuto</button>
</div>
<div class="status" id="status" role="status">Načítám 3D model…</div>
</main>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js"
  }
}
</script>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/controls/OrbitControls.js';

const stage = document.getElementById('stage');
const status = document.getElementById('status');
window.addEventListener('error', event => {
  status.textContent = 'Chyba při vykreslení 3D modelu: ' + (event.message || 'neznámá chyba');
});
window.addEventListener('unhandledrejection', event => {
  status.textContent = 'Nepodařilo se načíst 3D knihovnu: ' + String(event.reason?.message || event.reason);
});
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1b2a21);

const camera = new THREE.PerspectiveCamera(34, 1, 0.1, 100);
const initialCamera = new THREE.Vector3(3.25, 2.65, 4.2);
camera.position.copy(initialCamera);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:false, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
stage.prepend(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.02, 0);
controls.enableDamping = true;
controls.dampingFactor = 0.065;
controls.rotateSpeed = 0.72;
controls.zoomSpeed = 0.8;
controls.minDistance = 2.6;
controls.maxDistance = 8;
controls.minPolarAngle = 0.18;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

scene.add(new THREE.HemisphereLight(0xe5f3ff, 0x273329, 2.1));

const key = new THREE.DirectionalLight(0xfff1dc, 4.2);
key.position.set(-3.5, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -4;
key.shadow.camera.right = 4;
key.shadow.camera.top = 5;
key.shadow.camera.bottom = -4;
key.shadow.bias = -0.00025;
scene.add(key);

const rim = new THREE.DirectionalLight(0x8bb8ff, 2.2);
rim.position.set(4, 3, -3);
scene.add(rim);

const pawn = new THREE.Group();
scene.add(pawn);

const redPlastic = new THREE.MeshPhysicalMaterial({
  color:0xd92335, roughness:0.22, metalness:0.04,
  clearcoat:0.72, clearcoatRoughness:0.18
});
const darkBase = new THREE.MeshStandardMaterial({
  color:0x202a28, roughness:0.26, metalness:0.58
});
const trimMaterial = new THREE.MeshStandardMaterial({
  color:0xd8b76c, roughness:0.2, metalness:0.78
});

function addMesh(geometry, material, y, target=pawn) {
  const mesh = new THREE.Mesh(geometry, material);
  mesh.position.y = y;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  target.add(mesh);
  return mesh;
}

// Široký kruhový podstavec s kovovým lemem a mírně zkosenou hranou.
addMesh(new THREE.CylinderGeometry(0.76, 0.82, 0.18, 64, 1), darkBase, 0.11);
addMesh(new THREE.CylinderGeometry(0.755, 0.79, 0.045, 64, 1), trimMaterial, 0.205);
addMesh(new THREE.CylinderGeometry(0.70, 0.73, 0.075, 64, 1), redPlastic, 0.255);

// Tělo je souvislý soustružený tvar, nikoli plochá silueta.
const profile = [
  new THREE.Vector2(0.00, 0.28),
  new THREE.Vector2(0.48, 0.28),
  new THREE.Vector2(0.54, 0.34),
  new THREE.Vector2(0.52, 0.43),
  new THREE.Vector2(0.43, 0.55),
  new THREE.Vector2(0.32, 0.72),
  new THREE.Vector2(0.265, 0.91),
  new THREE.Vector2(0.27, 1.08),
  new THREE.Vector2(0.34, 1.20),
  new THREE.Vector2(0.36, 1.27),
  new THREE.Vector2(0.29, 1.33),
  new THREE.Vector2(0.00, 1.33)
];
const body = new THREE.Mesh(new THREE.LatheGeometry(profile, 64), redPlastic);
body.castShadow = true;
body.receiveShadow = true;
pawn.add(body);

// Krátký krček a kulová hlava s jemným spojovacím prstencem.
addMesh(new THREE.CylinderGeometry(0.265, 0.29, 0.17, 48), redPlastic, 1.34);
addMesh(new THREE.TorusGeometry(0.292, 0.027, 12, 64), trimMaterial, 1.29);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.39, 64, 48), redPlastic);
head.position.y = 1.67;
head.castShadow = true;
head.receiveShadow = true;
pawn.add(head);

// Jemný odlesk je geometrický detail, ne textura.
const glint = new THREE.Mesh(
  new THREE.SphereGeometry(0.055, 20, 16),
  new THREE.MeshBasicMaterial({color:0xffffff})
);
glint.position.set(-0.13, 1.84, 0.335);
glint.scale.set(1.25, 0.72, 0.35);
pawn.add(glint);

// Podlaha a měkký stín pod figurkou.
const floor = new THREE.Mesh(
  new THREE.PlaneGeometry(200, 200),
  new THREE.MeshStandardMaterial({color:0x26352c, roughness:0.88, metalness:0.02})
);
floor.rotation.x = -Math.PI / 2;
floor.position.y = 0.005;
floor.receiveShadow = true;
scene.add(floor);

function resize() {
  const width = stage.clientWidth;
  const height = stage.clientHeight;
  if (!width || !height) return;
  camera.aspect = width / height;
  camera.updateProjectionMatrix();
  renderer.setSize(width, height, false);
}
const resizeObserver = new ResizeObserver(resize);
resizeObserver.observe(stage);
resize();

document.getElementById('reset-view').addEventListener('click', () => {
  camera.position.copy(initialCamera);
  controls.target.set(0, 1.02, 0);
  controls.update();
  pawn.rotation.y = 0;
});
let autoRotate = false;
const spinButton = document.getElementById('toggle-spin');
spinButton.addEventListener('click', () => {
  autoRotate = !autoRotate;
  controls.autoRotate = autoRotate;
  spinButton.textContent = 'Automatické otáčení: ' + (autoRotate ? 'zapnuto' : 'vypnuto');
  spinButton.setAttribute('aria-pressed', String(autoRotate));
});

const clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const delta = Math.min(clock.getDelta(), 0.05);
  if (autoRotate) pawn.rotation.y += delta * 0.42;
  controls.update();
  renderer.render(scene, camera);
}
animate();
status.textContent = 'Model připraven. Figurku lze volně otáčet a přibližovat.';
</script>
</body>
</html>
